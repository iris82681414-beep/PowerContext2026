app:
  name: 末班月亮档案室
  description: 23:45，人造月亮失踪。用同一笔记编号跨轮调查，收集身份与动机证据链，指认后在 seekdb 保存进度。
  mode: workflow
  icon: 🌙
  icon_background: '#E4DBFF'
  use_icon_as_answer_icon: false
kind: app
version: 0.5.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: e487169d-229c-4bc9-86fd-6028ec996917
    name: ARCHIVE_TOKEN
    value_type: secret
    value: ''
    description: 私有案卷服务访问令牌；部署时填写，与服务端 ARCHIVE_TOKEN 一致
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
    speech_to_text:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
    - id: '1793873000001'
      type: custom
      data:
        type: start
        title: 领取侦探笔记
        desc: ''
        selected: false
        variables:
        - label: 笔记编号（8–64 位字母、数字或下划线）
          variable: session
          type: text-input
          required: true
          max_length: 64
          options: []
        - label: 行动
          variable: action
          type: select
          required: true
          max_length: 4
          options:
          - 调查
          - 指认
          - 重开
        - label: 档案关键词或嫌疑人（重开可填任意字）
          variable: query
          type: text-input
          required: true
          max_length: 120
          options: []
      position:
        x: 370
        y: 100
      positionAbsolute:
        x: 370
        y: 100
      width: 242
      height: 110
      sourcePosition: right
      targetPosition: left
    - id: '1793873000002'
      type: custom
      data:
        type: code
        title: 整理行动与 JSON 请求
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\n\ndef main(session: str, action: str, query: str) -> dict:\n    session =\
          \ session.strip()\n    if not re.fullmatch(r\"[A-Za-z0-9_-]{8,64}\", session):\n        raise ValueError(\"\
          笔记编号需要 8–64 位字母、数字、下划线或短横线\")\n    if action not in (\"调查\", \"指认\", \"重开\"):\n        raise ValueError(\"\
          请选择调查、指认或重开\")\n    query = query.strip()\n    return {\"action\": action, \"payload\": json.dumps({\"\
          session\": session, \"action\": action, \"query\": query}, ensure_ascii=False)}\n"
        variables:
        - variable: session
          value_selector:
          - '1793873000001'
          - session
        - variable: action
          value_selector:
          - '1793873000001'
          - action
        - variable: query
          value_selector:
          - '1793873000001'
          - query
        outputs:
          action:
            type: string
            children: null
          payload:
            type: string
            children: null
      position:
        x: 660
        y: 100
      positionAbsolute:
        x: 660
        y: 100
      width: 242
      height: 110
      sourcePosition: right
      targetPosition: left
    - id: '1793873000003'
