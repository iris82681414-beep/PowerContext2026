    - id: '1793873000005'
      type: custom
      data:
        type: code
        title: 整理线索与解锁证据链
        desc: ''
        selected: false
        code_language: python3
        code: "import json\n\ndef main(request: str, status: int, body: str) -> dict:\n    if status != 200:\n \
          \       raise ValueError(\"档案室暂时无法读取，请稍后重试\")\n    turn = json.loads(request)\n    archive = json.loads(body)\n\
          \    facts = archive[\"facts\"]\n    seen = set(archive[\"state\"][\"seen\"]) | {fact[\"id\"] for fact\
          \ in facts}\n    lines = [\"[\" + f[\"id\"] + \"] \" + f[\"title\"] + \"：\" + f[\"body\"] for f in facts]\n\
          \    if not lines:\n        lines = [\"没有匹配的案卷。试试「工牌」「录像」「冷却台」「温度」或「南门」。\"]\n    deductions = []\n   \
          \ if {\"A01\", \"A03\"} <= seen:\n        deductions.append(\"身份链已解锁：A01 的 17 号工牌与 A03 的领用记录互相印证。\")\n\
          \    if {\"A04\", \"A06\"} <= seen:\n        deductions.append(\"动机链已解锁：A04 的目的地与 A06 的降温规程互相印证。\")\n\
          \    if \"A02\" in seen:\n        deductions.append(\"排除线索：A02 记录了阿栖在关键时间段的不在场证明。\")\n    if \"A05\" in\
          \ seen:\n        deductions.append(\"排除线索：A05 的南门门卡与 A01 的临时工牌不是同一张。\")\n    if not deductions:\n    \
          \    deductions.append(\"还没有形成互相印证的证据链；可以继续追查同一案卷里的关键词。\")\n    turn.update(revision=archive[\"state\"\
          ][\"revision\"], clues=[f[\"id\"] for f in facts], decision=\"investigated\", result=\"\\n\\n\".join(lines\
          \ + deductions))\n    return {\"payload\": json.dumps(turn, ensure_ascii=False)}\n"
        variables:
        - variable: request
          value_selector:
          - '1793873000002'
          - payload
        - variable: status
          value_selector:
          - '1793873000004'
          - status_code
        - variable: body
          value_selector:
          - '1793873000004'
          - body
        outputs:
          payload:
            type: string
            children: null
      position:
        x: 1530
        y: 100
      positionAbsolute:
        x: 1530
        y: 100
      width: 242
      height: 110
      sourcePosition: right
      targetPosition: left
