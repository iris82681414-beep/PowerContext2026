        title: 确认持久化并展示进度
        desc: ''
        selected: false
        code_language: python3
        code: "import json\n\ndef main(status: int, body: str) -> dict:\n    if status == 409:\n        return {\"\
          result\": \"同一本笔记刚刚被更新。本次行动未保存，请重新执行。\"}\n    if status != 200:\n        return {\"result\": \"笔记未保存，请稍后重试这次行动。\"\
          }\n    saved = json.loads(body)\n    state = saved[\"state\"]\n    progress = \"笔记已保存 · 线索 \" + str(len(state[\"\
          seen\"])) + \"/6 · 指认 \" + str(state[\"attempts\"]) + \" 次 · 第 \" + str(state[\"revision\"]) + \" 轮 ·\
          \ \" + (\"已结案\" if state[\"completed\"] else \"调查中\")\n    return {\"result\": saved[\"result\"] + \"\\\
          n\\n\" + progress}\n"
        variables:
