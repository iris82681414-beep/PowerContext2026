    - id: '1793873000010'
      type: custom
      data:
        type: code
        title: 审查证据链并作出判定
        desc: ''
        selected: false
        code_language: python3
        code: "import json\n\ndef main(request: str, status: int, body: str) -> dict:\n    if status != 200:\n \
          \       raise ValueError(\"档案室暂时无法读取，请稍后重试\")\n    turn = json.loads(request)\n    archive = json.loads(body)\n\
          \    seen = set(archive[\"state\"][\"seen\"])\n    missing = sorted({\"A01\", \"A03\", \"A04\", \"A06\"\
          } - seen)\n    if archive[\"state\"][\"completed\"]:\n        decision, result = \"already_solved\", \"\
          本笔记已结案。选择「重开」可开始新一轮调查。\"\n    elif missing:\n        decision = \"insufficient\"\n        result = \"\
          证据不足，暂不能结案。尚未收集：\" + \"、\".join(missing) + \"。身份链需要 A01+A03，动机链需要 A04+A06。继续调查「工牌」和「冷却台」。\"\n    elif\
          \ turn[\"query\"] != archive[\"verdict\"][\"culprit\"]:\n        decision = \"wrong\"\n        result\
          \ = \"指认暂未成立。回看 A01 与 A03 的工牌记录，再用 A04 与 A06 检查这个人的行为动机。\"\n    else:\n        decision = \"solved\"\n\
          \        result = \"结案！\" + archive[\"verdict\"][\"explanation\"]\n    turn.update(revision=archive[\"\
          state\"][\"revision\"], clues=[], decision=decision, result=result)\n    return {\"payload\": json.dumps(turn,\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: request
          value_selector:
          - '1793873000002'
          - payload
        - variable: status
          value_selector:
          - '1793873000009'
          - status_code
        - variable: body
          value_selector:
          - '1793873000009'
          - body
        outputs:
          payload:
            type: string
            children: null
